[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coffer-horizon"
version = "0.1.0"
description = "Horizon dashboard for the OpenStack-native Coffer OCI Registry"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "horizon>=25.7.3,<26.0.0",
  "keystoneauth1>=5.13.1",
]

[project.optional-dependencies]
test = [
  "Django==4.2.28",
  "horizon==25.7.3",
  "keystoneauth1==5.13.1",
  "pytest==9.0.2",
  "pytest-django==4.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cofferdashboard*"]

[tool.setuptools.package-data]
cofferdashboard = [
  "conf/*.yaml",
  "local_settings.d/*.py",
  "templates/**/*.html",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cofferdashboard.tests.settings"
markers = [
  "plugin_test: Horizon plugin configuration test",
  "selenium: Horizon browser test",
]
testpaths = ["cofferdashboard/tests"]
