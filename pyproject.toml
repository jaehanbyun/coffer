[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coffer"
version = "0.1.0"
description = "OpenStack-native OCI Registry control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "cryptography==49.0.0",
  "falcon==4.3.1",
  "gunicorn==26.0.0",
  "keystoneauth1==5.15.0",
  "keystonemiddleware==13.0.0",
  "oslo.cache==4.3.0",
  "oslo.config==10.5.0",
  "oslo.context==6.5.0",
  "oslo.db==18.1.0",
  "oslo.log==8.3.0",
  "oslo.policy==6.0.0",
  "prometheus-client==0.25.0",
  "PyJWT==2.13.0",
  "SQLAlchemy==2.0.51",
  "WebOb==1.8.10",
]

[project.scripts]
coffer-api = "coffer.api_runner:main"
coffer-inventory-verify = "coffer.inventory:main"
coffer-import-inventory = "coffer.quota_import:main"
coffer-verify-inventory-import = "coffer.quota_import_verification:main"
coffer-reconcile = "coffer.reconciliation_runner:main"
coffer-bootstrap = "coffer.bootstrap:main"
coffer-config-validate = "coffer.config_validator:main"
coffer-edge = "coffer.edge_runner:main"
coffer-registry-metrics = "coffer.registry_metrics_runner:main"

[project.entry-points."openstack.cli.extension"]
registry = "cofferclient.osc.plugin"

[project.entry-points."openstack.registry.v1"]
registry_endpoint_show = "cofferclient.osc.commands:ShowEndpoint"
registry_artifact_list = "cofferclient.osc.commands:ListArtifacts"
registry_artifact_show = "cofferclient.osc.commands:ShowArtifact"
registry_login = "cofferclient.osc.commands:Login"
registry_quota_show = "cofferclient.osc.commands:ShowQuota"
registry_repository_create = "cofferclient.osc.commands:CreateRepository"
registry_repository_list = "cofferclient.osc.commands:ListRepositories"
registry_repository_show = "cofferclient.osc.commands:ShowRepository"

[project.optional-dependencies]
client = [
  "osc-lib==4.4.0",
  "python-openstackclient==9.0.0",
]
mariadb = [
  "PyMySQL==1.2.0",
]
postgresql = [
  "psycopg[binary]==3.3.4",
]

[dependency-groups]
test = [
  "fixtures==4.3.2",
  "pytest==8.4.2",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coffer.migrations" = ["script.py.mako"]
