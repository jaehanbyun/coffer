---
- name: Ensure the HAProxy custom CA input directory exists for Coffer
  ansible.builtin.file:
    path: "{{ node_config_directory }}/haproxy/ca-certificates"
    state: directory
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0750"
  become: true
  notify: Restart haproxy container
  when:
    - coffer_enable_tls_backend | bool
    - kolla_copy_ca_into_containers | bool

- name: Install the verified Coffer backend CA into HAProxy trust
  ansible.builtin.copy:
    src: "{{ coffer_backend_cacert }}"
    dest: >-
      {{ node_config_directory
      }}/haproxy/ca-certificates/coffer-backend-ca.crt
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  notify: Restart haproxy container
  when:
    - coffer_enable_tls_backend | bool
    - kolla_copy_ca_into_containers | bool

- name: Configure HAProxy and ProxySQL for Coffer
  ansible.builtin.import_role:
    name: loadbalancer-config
  vars:
    project_services: "{{ coffer_services }}"
  tags: always
  no_log: true

- name: Install the exact maintenance client CA into HAProxy
  ansible.builtin.copy:
    src: "{{ coffer_maintenance_client_ca_file }}"
    dest: >-
      {{ node_config_directory
      }}/haproxy/ca-certificates/coffer-maintenance-client-ca.crt
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  notify: Restart haproxy container
  when:
    - coffer_enable_maintenance_identity | bool
    - kolla_copy_ca_into_containers | bool

- name: Render the private mTLS maintenance frontend
  ansible.builtin.template:
    src: "haproxy-maintenance.cfg.j2"
    dest: >-
      {{ node_config_directory
      }}/haproxy/services.d/coffer-maintenance.cfg
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  notify: Restart haproxy container
  when: coffer_enable_maintenance_identity | bool

- name: Remove the private maintenance frontend when disabled
  ansible.builtin.file:
    path: >-
      {{ node_config_directory
      }}/haproxy/services.d/coffer-maintenance.cfg
    state: absent
  become: true
  notify: Restart haproxy container
  when: not coffer_enable_maintenance_identity | bool
