---
- name: Ensure Coffer service configuration directories exist
  ansible.builtin.file:
    path: "{{ node_config_directory }}/{{ item.key }}"
    state: directory
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  loop: >-
    {{
      coffer_services |
      select_services_enabled_and_mapped_to_host |
      dict2items
    }}
  loop_control:
    label: "{{ item.key }}"

- name: Ensure the Coffer bootstrap configuration directory exists
  ansible.builtin.file:
    path: "{{ node_config_directory }}/coffer-bootstrap"
    state: directory
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  when: inventory_hostname in groups['coffer-api']

- name: Ensure the disabled reconciler fixture directory exists
  ansible.builtin.file:
    path: "{{ node_config_directory }}/coffer-reconcile"
    state: directory
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  when:
    - coffer_enable_maintenance_identity | bool
    - not coffer_enable_reconcile | bool
    - inventory_hostname in groups['coffer-reconcile']

- name: Render Coffer Kolla config.json contracts
  ansible.builtin.template:
    src: "{{ coffer_source_root }}/docker/config/{{ item.key }}.json.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/config.json"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  loop: >-
    {{
      coffer_services |
      select_services_enabled_and_mapped_to_host |
      dict2items
    }}
  loop_control:
    label: "{{ item.key }}"

- name: Render the Coffer bootstrap config.json contract
  ansible.builtin.template:
    src: "{{ coffer_source_root }}/docker/config/coffer-bootstrap.json.j2"
    dest: "{{ node_config_directory }}/coffer-bootstrap/config.json"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  when: inventory_hostname in groups['coffer-api']

- name: Render the disabled reconciler maintenance recipient fixture
  ansible.builtin.template:
    src: "{{ coffer_source_root }}/docker/config/coffer-reconcile.json.j2"
    dest: "{{ node_config_directory }}/coffer-reconcile/config.json"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0660"
  become: true
  when:
    - coffer_enable_maintenance_identity | bool
    - not coffer_enable_reconcile | bool
    - inventory_hostname in groups['coffer-reconcile']

- name: Render per-process Coffer configuration
  vars:
    service_name: "{{ item.key }}"
  ansible.builtin.template:
    src: "coffer.conf.j2"
    dest: "{{ node_config_directory }}/{{ item.key }}/coffer.conf"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  loop: >-
    {{
      coffer_services |
      dict2items |
      rejectattr('key', 'equalto', 'coffer-registry') |
      rejectattr('key', 'equalto', 'coffer-registry-metrics') |
      selectattr('value.enabled') |
      selectattr('value.group', 'in', group_names) |
      list
    }}
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Render the registry metrics allowlist proxy configuration
  ansible.builtin.template:
    src: "registry-metrics.conf.j2"
    dest: >-
      {{ node_config_directory }}/coffer-registry-metrics/coffer.conf
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  when:
    - coffer_enable_metrics | bool
    - inventory_hostname in groups['coffer-registry']

- name: Render the bootstrap-only Coffer configuration
  vars:
    service_name: "coffer-bootstrap"
  ansible.builtin.template:
    src: "coffer.conf.j2"
    dest: "{{ node_config_directory }}/coffer-bootstrap/coffer.conf"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['coffer-api']
  no_log: true

- name: Render the disabled reconciler maintenance configuration fixture
  vars:
    service_name: "coffer-reconcile"
  ansible.builtin.template:
    src: "coffer.conf.j2"
    dest: "{{ node_config_directory }}/coffer-reconcile/coffer.conf"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  when:
    - coffer_enable_maintenance_identity | bool
    - not coffer_enable_reconcile | bool
    - inventory_hostname in groups['coffer-reconcile']
  no_log: true

- name: Render the private Distribution configuration
  ansible.builtin.template:
    src: "registry-config.yml.j2"
    dest: "{{ node_config_directory }}/coffer-registry/config.yml"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['coffer-registry']
  no_log: true

- name: Copy the API signing key to its sole recipient
  ansible.builtin.copy:
    src: "{{ coffer_signing_key_file }}"
    dest: "{{ node_config_directory }}/coffer-api/signing-key.pem"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  when: inventory_hostname in groups['coffer-api']
  no_log: true

- name: Copy public JWKS only to edge and registry
  ansible.builtin.copy:
    src: "{{ coffer_jwks_file }}"
    dest: "{{ node_config_directory }}/{{ item }}/jwks.json"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  loop:
    - coffer-edge
    - coffer-registry
  when: >-
    inventory_hostname in
    groups[coffer_services[item].group]

- name: Copy the verified Coffer backend CA material to edge
  ansible.builtin.copy:
    src: "{{ coffer_backend_cacert }}"
    dest: "{{ node_config_directory }}/coffer-edge/backend-ca.crt"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  when: inventory_hostname in groups['coffer-edge']

- name: Copy the verified Coffer backend CA material to the reconciler
  ansible.builtin.copy:
    src: "{{ coffer_backend_cacert }}"
    dest: "{{ node_config_directory }}/coffer-reconcile/registry-ca.crt"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  when:
    - >-
      coffer_enable_reconcile | bool or
      coffer_enable_maintenance_identity | bool
    - inventory_hostname in groups['coffer-reconcile']

- name: Copy exact maintenance identity files to the reconciler fixture
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: >-
      {{ node_config_directory }}/coffer-reconcile/{{ item.dest }}
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "{{ item.mode }}"
  become: true
  loop:
    - src: >-
        {{ coffer_secret_source_dir }}/maintenance/{{
        inventory_hostname }}/application-credential-id
      dest: "maintenance-application-credential-id"
      mode: "0600"
    - src: >-
        {{ coffer_secret_source_dir }}/maintenance/{{
        inventory_hostname }}/application-credential-secret
      dest: "maintenance-application-credential-secret"
      mode: "0600"
    - src: >-
        {{ coffer_public_source_dir }}/maintenance/{{
        inventory_hostname }}/client.crt
      dest: "maintenance-client.crt"
      mode: "0644"
    - src: >-
        {{ coffer_secret_source_dir }}/maintenance/{{
        inventory_hostname }}/client.key
      dest: "maintenance-client.key"
      mode: "0600"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - coffer_enable_maintenance_identity | bool
    - inventory_hostname in groups['coffer-reconcile']
  no_log: true

- name: Copy verified RGW CA material only to Distribution
  ansible.builtin.copy:
    src: "{{ coffer_rgw_cacert }}"
    dest: "{{ node_config_directory }}/coffer-registry/rgw-ca.crt"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  when: inventory_hostname in groups['coffer-registry']

- name: Ensure Kolla custom CA directories exist for Coffer processes
  ansible.builtin.file:
    path: >-
      {{ node_config_directory }}/{{ item.key }}/ca-certificates
    state: directory
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0750"
  become: true
  loop: >-
    {{
      coffer_services |
      select_services_enabled_and_mapped_to_host |
      dict2items
    }}
  loop_control:
    label: "{{ item.key }}"
  when: kolla_copy_ca_into_containers | bool

- name: Install the verified RGW CA into the Distribution system trust input
  ansible.builtin.copy:
    src: "{{ coffer_rgw_cacert }}"
    dest: >-
      {{ node_config_directory
      }}/coffer-registry/ca-certificates/coffer-rgw-ca.crt
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  when:
    - kolla_copy_ca_into_containers | bool
    - inventory_hostname in groups['coffer-registry']

- name: Install the verified backend CA into Coffer system trust inputs
  ansible.builtin.copy:
    src: "{{ coffer_backend_cacert }}"
    dest: >-
      {{ node_config_directory
      }}/{{ item }}/ca-certificates/coffer-backend-ca.crt
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  loop:
    - coffer-api
    - coffer-edge
    - coffer-reconcile
  when:
    - kolla_copy_ca_into_containers | bool
    - inventory_hostname in groups[coffer_services[item].group]
    - coffer_services[item].enabled | bool

- name: Copy backend TLS certificates to listener processes
  vars:
    certificate_names:
      coffer-api: "api.crt"
      coffer-edge: "edge.crt"
      coffer-registry: "registry.crt"
      coffer-registry-metrics: "registry-metrics.crt"
      coffer-reconcile: "reconcile-metrics.crt"
  ansible.builtin.copy:
    src: "{{ coffer_backend_tls_cert }}"
    dest: >-
      {{ node_config_directory }}/{{ item.key
      }}/{{ certificate_names[item.key] }}
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0644"
  become: true
  loop: >-
    {{
      coffer_services |
      select_services_enabled_and_mapped_to_host |
      dict2items |
      selectattr('value.port', 'defined') |
      list
    }}
  loop_control:
    label: "{{ item.key }}"

- name: Copy backend TLS private keys to listener processes
  vars:
    private_key_names:
      coffer-api: "api.key"
      coffer-edge: "edge.key"
      coffer-registry: "registry.key"
      coffer-registry-metrics: "registry-metrics.key"
      coffer-reconcile: "reconcile-metrics.key"
  ansible.builtin.copy:
    src: "{{ coffer_backend_tls_key }}"
    dest: >-
      {{ node_config_directory }}/{{ item.key
      }}/{{ private_key_names[item.key] }}
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0600"
  become: true
  loop: >-
    {{
      coffer_services |
      select_services_enabled_and_mapped_to_host |
      dict2items |
      selectattr('value.port', 'defined') |
      list
    }}
  loop_control:
    label: "{{ item.key }}"
  no_log: true

- name: Copy backend TLS listener files to the disabled reconciler fixture
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ node_config_directory }}/coffer-reconcile/{{ item.dest }}"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "{{ item.mode }}"
  become: true
  loop:
    - src: "{{ coffer_backend_tls_cert }}"
      dest: "reconcile-metrics.crt"
      mode: "0644"
    - src: "{{ coffer_backend_tls_key }}"
      dest: "reconcile-metrics.key"
      mode: "0600"
  loop_control:
    label: "{{ item.dest }}"
  when:
    - coffer_enable_maintenance_identity | bool
    - not coffer_enable_reconcile | bool
    - coffer_reconcile_mode == 'periodic'
    - inventory_hostname in groups['coffer-reconcile']
  no_log: true

- name: Copy Kolla CA bundles into Coffer containers
  ansible.builtin.import_role:
    name: service-cert-copy
  vars:
    project_services: "{{ coffer_processes }}"
    kolla_copy_backend_tls_files: false

- name: Install Coffer observability inputs on the controller
  ansible.builtin.import_tasks: observability.yml
  when: coffer_manage_observability_overrides | bool

- name: Restore strict Coffer configuration directory ownership and modes
  ansible.builtin.file:
    path: "{{ node_config_directory }}/{{ item.key }}"
    owner: "{{ config_owner_user }}"
    group: "{{ config_owner_group }}"
    mode: "0770"
  become: true
  loop: >-
    {{
      coffer_services |
      select_services_enabled_and_mapped_to_host |
      dict2items
    }}
  loop_control:
    label: "{{ item.key }}"
