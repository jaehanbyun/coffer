kolla:
  controller_count: 3
  network_interface: ens3
  api_interface: ens3
  storage_interface: ens4
  kolla_external_vip_interface: ens5
  enable_openstack_core: false
  required_services:
    - haproxy
    - keepalived
    - mariadb
    - rabbitmq
    - memcached
    - keystone

ceph:
  node_count: 3
  replica_size: 3
  minimum_replica_size: 2
  rgw_daemons_per_host: 1
  ingress_daemons: 2
