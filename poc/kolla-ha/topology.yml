      macs:
        management: "52:54:00:c5:02:11"
        storage: "52:54:00:c5:02:12"
        external: "52:54:00:c5:02:13"
    - name: coffer-kolla-ha-stage5-controller-3
      vcpus: 8
      memory_mib: 16384
      root_gib: 96
      management_address: 192.168.252.13
      storage_address: 192.168.253.13
      external_address: null
      macs:
        management: "52:54:00:c5:03:11"
        storage: "52:54:00:c5:03:12"
        external: "52:54:00:c5:03:13"
  storage:
    - name: coffer-rgw-ha-stage5-storage-1
      vcpus: 4
      memory_mib: 8192
      root_gib: 32
