---
schema: coffer.stage5.topology.v1

host_safety:
  minimum_available_memory_gib_after_allocation: 40
  minimum_available_storage_gib_after_allocation: 250
  required_architecture: x86_64
  required_logical_cpus: 32
  required_pool: coffer-rgw
  forbidden_existing_domain_prefixes:
    - coffer-kolla-ha-stage5-
    - coffer-rgw-ha-stage5-

image:
  distribution: ubuntu
  release: noble
  build: "20260705"
  architecture: amd64
  source_base_url: https://cloud-images.ubuntu.com/noble/20260705
  source_name: noble-server-cloudimg-amd64.img
  sha256: ffe6203da54deeb6db5d2a98a83f9ec8e55f149d3f7ba622e1abe5fa966ee3d6
  base_volume: coffer-stage5-ubuntu-noble-base.qcow2

networks:
  management:
    name: coffer-stage5-mgmt
    bridge: virbr252
    cidr: 192.168.252.0/24
    host_address: 192.168.252.1
    mode: nat
    dhcp: false
    kolla_internal_vip: 192.168.252.10
  storage:
    name: coffer-stage5-storage
    bridge: virbr253
    cidr: 192.168.253.0/24
    host_address: 192.168.253.1
    mode: isolated
    dhcp: false
    rgw_virtual_ip: 192.168.253.30
    rgw_frontend_port: 8443
  external:
    name: coffer-stage5-external
    bridge: virbr254
    cidr: 192.168.254.0/24
    host_address: 192.168.254.1
    mode: isolated
    dhcp: false
    kolla_external_vip: 192.168.254.10

