      storage_address: 192.168.253.11
      external_address: null
      macs:
        management: "52:54:00:c5:01:11"
        storage: "52:54:00:c5:01:12"
        external: "52:54:00:c5:01:13"
    - name: coffer-kolla-ha-stage5-controller-2
      vcpus: 8
      memory_mib: 16384
