---
kolla_base_distro: "ubuntu"
openstack_release: "2026.1"
docker_registry: "quay.io"
docker_namespace: "openstack.kolla"
config_strategy: "COPY_ALWAYS"

network_interface: "ens3"
api_interface: "ens3"
storage_interface: "ens4"
cluster_interface: "ens4"
tunnel_interface: "ens4"
kolla_external_vip_interface: "ens5"
kolla_internal_vip_address: "192.168.252.10"
kolla_internal_fqdn: "192.168.252.10"
kolla_external_vip_address: "192.168.254.10"
kolla_external_fqdn: "192.168.254.10"
kolla_same_external_internal_vip: false
kolla_enable_tls_internal: false
kolla_enable_tls_external: true
kolla_certificates_dir: "/etc/kolla/certificates-stage5"

enable_openstack_core: false
enable_keystone: true
enable_haproxy: true
enable_keepalived: true
enable_mariadb: true
enable_proxysql: true
enable_rabbitmq: true
enable_memcached: true
enable_fluentd: true
enable_horizon: false
enable_cinder: false
enable_swift: false
enable_prometheus: false

openstack_logging_debug: false
update_keystone_service_user_passwords: false
