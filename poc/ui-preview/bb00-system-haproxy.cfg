# BEGIN COFFER UI PREVIEW
frontend coffer_ui_preview_horizon_tls
    bind 100.123.168.66:18443
    mode tcp
    default_backend coffer_ui_preview_horizon_tls

backend coffer_ui_preview_horizon_tls
    mode tcp
    option tcp-check
    server coffer_aio 192.168.122.221:443 check inter 5s fall 3 rise 2

frontend coffer_ui_preview_skyline_tls
    bind 100.123.168.66:19999
    mode tcp
    default_backend coffer_ui_preview_skyline_tls

backend coffer_ui_preview_skyline_tls
    mode tcp
    option tcp-check
    server coffer_aio 192.168.122.221:9999 check inter 5s fall 3 rise 2

frontend coffer_registry_preview_https
    bind 100.123.168.66:18788 ssl crt /etc/haproxy/certs/coffer-registry-preview.pem alpn h2,http/1.1 ssl-min-ver TLSv1.2
    mode http
    option httplog
    timeout client 5m
    http-request deny deny_status 403 if { path -i -m beg /v1/internal/ }
    http-request deny deny_status 403 if { path -i /healthz }
    http-request deny deny_status 403 if { path -i /readyz }
    http-request deny deny_status 403 if { path -i /metrics }
    http-request deny deny_status 403 if { path -i -m beg /debug }
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=86400"
    default_backend coffer_registry_preview_https

backend coffer_registry_preview_https
    mode http
    option http-keep-alive
    option httpchk GET /v2/
    http-check expect status 401
    timeout connect 10s
    timeout server 5m
    server coffer_edge_primary 192.168.122.204:8788 ssl verify required ca-file /etc/haproxy/ca-certificates/coffer-backend-ca.crt verifyhost 192.168.122.204 check inter 2s fall 2 rise 2
    server coffer_edge_replica 192.168.122.204:18888 ssl verify required ca-file /etc/haproxy/ca-certificates/coffer-backend-ca.crt verifyhost 192.168.122.204 check inter 2s fall 2 rise 2
# END COFFER UI PREVIEW
